# hmi/backend/config.yaml
arms:
  - id: right
    model: so101_follower
    port: /dev/haller_arm_follower   # udev symlink from scripts/99-haller-devices.rules
    calibration_id: haller_follower  # robots/so_follower/haller_follower.json
    enabled: true
  - id: left
    model: so101_follower
    port: /dev/haller_arm_leader
    # haller_leader was originally calibrated as a teleoperator. The HMI backend
    # auto-copies the teleop calibration into robots/so_follower/ on startup so
    # the same arm can be driven as a follower too — required for the teleop
    # feature where left and right swap roles freely.
    calibration_id: haller_leader
    enabled: true
ros:
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  scan_topic: /scan
  max_linear: 1.0
  max_angular: 2.0
telemetry:
  hz: 20
cameras:
  - id: wrist_right
    role: wrist
    arm_id: right
    source: placeholder  # one of: placeholder, mjpeg, webrtc
  - id: base_front
    role: base
    source: placeholder
