# hmi/backend/config.yaml
arms:
  - id: right
    model: so101_follower
    port: /dev/haller_arm_follower   # udev symlink from scripts/99-haller-devices.rules
    calibration_id: haller_follower  # robots/so_follower/haller_follower.json
    enabled: true
  - id: left
    model: so101_follower
    port: /dev/haller_arm_leader
    # haller_leader was originally calibrated as a teleoperator. The HMI backend
    # auto-copies the teleop calibration into robots/so_follower/ on startup so
    # the same arm can be driven as a follower too — required for the teleop
    # feature where left and right swap roles freely.
    calibration_id: haller_leader
    enabled: true
ros:
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  scan_topic: /scan
  max_linear: 1.0
  max_angular: 2.0
telemetry:
  hz: 20
cameras:
  # source: placeholder | opencv | mjpeg | webrtc
  # When source: opencv, the HMI captures via lerobot.cameras.opencv and exposes
  # /cameras/<id>/snapshot + /cameras/<id>/stream. The same (index_or_path,
  # width, height, fps) tuple is what `lerobot-record --robot.cameras=...` wants,
  # so swapping a camera in here also wires it for dataset collection.
  - id: wrist_right
    role: wrist
    arm_id: right
    source: placeholder  # set source: opencv + index_or_path when wrist cam arrives
  - id: base_front
    role: base
    source: opencv
    # Laptop integrated webcam for now — swap to the real base-mounted cam when plugged in.
    index_or_path: /dev/video0
    width: 640
    height: 480
    fps: 30
