# hmi/backend/config.solo-real.yaml
# ONE real arm, driven from the DESKTOP, no Jetson. Brought up by
#   scripts/quest-teleop/up.sh --solo
#
# This is the first-hardware-run config: one arm on the bench, one hand on the
# grip, half as much that can go wrong. It exists because the teleop session
# used to require two arms unconditionally, so "test it on one arm" was not a
# thing you could ask for.
#
# The arm here is the board whose USB-C still works (CH343, serial
# 5B14030445), jumper on USB-SERVO, straight into a desktop USB port — the
# same one config.desktop-real.yaml calls `left`. If the OTHER board is the
# working one on the night, swap the port/calibration_id pair below; nothing
# else in this file cares which physical arm it is.
#
# Which HAND drives it is NOT set here — it is chosen when the session starts
# (the VR page's "Right hand" selector, or `right_arm` on
# POST /teleop/human/start). Pick the hand the arm is actually under.

motion:
  # The binding speed limit for teleop, and worth knowing about before you
  # decide the tracking feels sluggish: the IK, the session's rate cap and
  # this are three limiters in series, and at 60 deg/s THIS is the one that
  # bites. Raise it here if the arm feels like it is wading; it is set low
  # because of the 2026-08-01 incident (a Home straight after a recalibration
  # slewed an arm into the bench and burnt the 7.4 V DC-DC), so raise it
  # deliberately and with a hand near the E-STOP.
  max_speed_deg_s: 60.0
  large_move_deg: 30.0
  ramp_hz: 50.0

collision:
  # OFF for the first single-arm run, on purpose and against the config
  # default. Two reasons, and the second is the real one:
  #
  #   1. With one arm there is no arm-vs-arm case at all. What is left is the
  #      self-collision pairs (hand/forearm vs. the base column) and the bench
  #      floors — a much smaller amount of guarding for a much larger amount
  #      of "why did it stop".
  #   2. The mounts below are still the SIM SCENE's placeholder +/-0.20 m.
  #      Nobody has measured the real tower. A guard reasoning about
  #      millimetres from geometry that is a guess is exactly what clamps an
  #      arm that is plainly nowhere near anything, which is the complaint
  #      this switch exists to answer.
  #
  # It is a runtime switch, not a restart: flip it from the VR page's Safety
  # card or `POST /teleop/human/collision {"enabled": true}`. Off still
  # MEASURES — `status().collision.slack_m` keeps updating — so the honest
  # first-run procedure is to drive with it off, watch the number, and turn it
  # on once the mounts have been measured and the number behaves.
  #
  # What stays on regardless: the teleop's own workspace floor (the commanded
  # fingertip and wrist can never go below the bench), the per-joint limits,
  # the acquisition ramp, the rate caps and the motion envelope above.
  enabled: false
  margin_m: 0.025
  self_margin_m: 0.008
  # The arm sits on the XLeRobot base plate, ~10 cm above the table surface
  # (measured 2026-08-24). The mount frame's z=0 is the plate, so the bench
  # is below it — this feeds the teleop's workspace floors (tip may go to
  # 5 mm above the table, wrist to 35 mm) even with the guard off.
  table_z_m: -0.10
  mounts:
    left:  {pos: [-0.20, 0.0, 0.0], yaw_deg: 0.0}
    right: {pos: [ 0.20, 0.0, 0.0], yaw_deg: 0.0}

arms:
  - id: left
    model: so101_follower
    port: /dev/haller_arm_leader
    calibration_id: haller_leader
    enabled: true
  # The second board stays out of this file entirely rather than sitting here
  # with `enabled: false`. An arm the config mentions but does not enable is
  # one more thing to misread at the bench at 22:00.

ros:
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  scan_topic: /scan
  max_linear: 1.0
  max_angular: 2.0

telemetry:
  # 20 Hz, not the sim's 30: the half-duplex Feetech bus interleaves 60 Hz
  # writes with these reads. The recorded dataset's fps follows this number.
  hz: 20

cameras:
  - id: base_front
    role: base
    source: opencv
    # Tower-mounted, facing the operator: the HUD mirrors this view for
    # DISPLAY only (never for recording) so it reads like a mirror instead of
    # left/right-flipped. See config.yaml's base_front for the full note.
    facing: operator
    index_or_path: /dev/haller_cam_mast
    width: 640
    height: 480
    fps: 30
  - id: wrist_left
    role: wrist
    arm_id: left
    # The gripper egocentric cams are IMX219 on Tegra CSI — there is no CSI on
    # the desktop, so they stay out of the dataset schema here.
    source: placeholder
