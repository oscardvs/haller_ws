# hmi/backend/pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haller-hmi"
version = "0.1.0"
description = "Haller robot unified HMI backend (FastAPI + lerobot + rclpy)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Oscar Devos" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pandas>=2.2.2",
    # numexpr + bottleneck are pandas optional-deps that get auto-imported.
    # The --system-site-packages venv inherits Debian's numpy-1 builds; we shadow
    # them with numpy-2-compatible wheels so the noisy "compiled using NumPy 1.x"
    # walls of text never appear on startup.
    "numexpr>=2.10",
    "bottleneck>=1.4",
    "numpy>=1.26",
    "lerobot[feetech]>=0.5,<0.6",
    "mujoco>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
haller-hmi = "haller_hmi.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["haller_hmi*"]

# The WebXR page the relay serves is data, not code, so a plain package find
# would leave it out of a built wheel and the headset would get a 404 from an
# installed backend while working fine from a source checkout.
[tool.setuptools.package-data]
"haller_hmi.vr_teleop" = ["web/*.html", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
