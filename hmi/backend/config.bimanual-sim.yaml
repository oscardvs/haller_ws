# Bimanual sim: two SO-101 followers facing the same workbench, three cubes
# and a place zone — the default teleop playground.
sim_cubes: 3
collision:
  # Tuned for sim, 2026-08-08: the defaults were written conservative for the
  # real tower. margin 25 -> 15 mm (min tip-to-tip 115 -> 105 mm; a direct
  # cube hand-off still needs set-down-regrasp — the 45 mm hand capsules, not
  # the margin, are the binding constraint there), wrist floor 30 -> 15 mm so
  # a level hand can actually reach a 4 cm cube resting on the bench. Real
  # configs keep the conservative values until the tower mounts are measured.
  margin_m: 0.015
  wrist_min_m: 0.015
arms:
  - id: left
    model: so101_follower
    port: "(sim)"
    calibration_id: "(sim)"
    source: sim
    sim_arm_name: left
    enabled: true
  - id: right
    model: so101_follower
    port: "(sim)"
    calibration_id: "(sim)"
    source: sim
    sim_arm_name: right
    enabled: true
ros:
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  scan_topic: /scan
  max_linear: 1.0
  max_angular: 2.0
telemetry:
  # 30 Hz, matched to the Quest's ~30 Hz publish rate and LeRobot's SO-101
  # dataset convention. The recorder samples at this rate, so it is also the
  # recorded dataset's fps. (The real rig stays 20 Hz: the half-duplex Feetech
  # bus already interleaves 60 Hz writes with these reads.)
  hz: 30
cameras:
  # Listed first, so the BASE tab and the headset's default view get the
  # over-the-shoulder camera: the egocentric eye of the default "behind"
  # stance, where the replica arm moves exactly like your own. threequarter
  # is the face-to-face counterpart ("mirror"/"front" stances); the overhead
  # cam reads shoulder_pan well but flattens lift/elbow away. The operator
  # views run 960x720 — they are what you teleop from; overhead and the
  # wrist close-ups stay 640x480. fps matches telemetry.hz so every recorded
  # frame has a fresh render.
  #
  # FIVE render, THREE are recorded (`record: true` + a `dataset_key`), and
  # the split is a training decision, not a plumbing one:
  #   - π0.5's pretrained camera slots are base_0_rgb + left_wrist_0_rgb +
  #     right_wrist_0_rgb — ONE base plus two wrists. Three keeps us in
  #     distribution; five is territory with no published run behind it.
  #   - armnet/armnetbench_v01_lerobot_bimanual_so101 (1,219 real bimanual
  #     SO-101 episodes) uses exactly top / left_wrist / right_wrist, so
  #     matching those dataset_keys turns co-training into a rename instead
  #     of a re-record.
  #   - Every recorded camera is a REQUIRED camera: recorder._build_frame
  #     drops the whole tick when ANY of them has no fresh image, so fewer
  #     channels means fewer dropped ticks.
  # threequarter is the base view rather than overhead (which flattens
  # lift/elbow and destroys the height cue grasping needs) or overshoulder
  # (egocentric — it puts the arms between the camera and the work, so the
  # policy would inherit the operator's self-occlusion). Both of those keep
  # rendering, so A/B-ing the choice later costs a config edit, not a rebuild.
  - id: overshoulder_sim
    role: base
    source: sim_camera
    mjcf_camera: overshoulder
    width: 960
    height: 720
    fps: 30
    record: false     # teleop eye only — egocentric, self-occluding
  - id: threequarter_sim
    role: base
    source: sim_camera
    mjcf_camera: threequarter
    width: 960
    height: 720
    fps: 30
    record: true
    dataset_key: top          # π0.5 base_0_rgb / armnetbench "top"
  - id: overhead_sim
    role: base
    source: sim_camera
    mjcf_camera: overhead
    width: 640
    height: 480
    fps: 30
    record: false     # flattens lift/elbow — no height cue for grasping
  - id: wrist_left_sim
    role: wrist
    arm_id: left
    source: sim_camera
    mjcf_camera: left_wristcam
    width: 640
    height: 480
    fps: 30
    record: true
    dataset_key: left_wrist   # π0.5 left_wrist_0_rgb
  - id: wrist_right_sim
    role: wrist
    arm_id: right
    source: sim_camera
    mjcf_camera: right_wristcam
    width: 640
    height: 480
    fps: 30
    record: true
    dataset_key: right_wrist  # π0.5 right_wrist_0_rgb
