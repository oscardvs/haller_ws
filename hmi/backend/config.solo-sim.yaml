# Solo SO-101 sim: one follower, workbench + two cubes + place zone.
sim_cubes: 2
collision:
  # Same sim tuning as config.bimanual-sim.yaml: the wrist floor at the
  # default 30 mm blocks level-hand grasps of a 4 cm bench cube.
  margin_m: 0.015
  wrist_min_m: 0.015
arms:
  - id: right
    model: so101_follower
    port: "(sim)"
    calibration_id: "(sim)"
    source: sim
    sim_arm_name: right
    enabled: true
ros:
  cmd_vel_topic: /cmd_vel
  odom_topic: /odom
  scan_topic: /scan
  max_linear: 1.0
  max_angular: 2.0
telemetry:
  # 30 Hz, matched to LeRobot's SO-101 convention; also the recorded dataset's
  # fps (the recorder samples at telemetry rate). Camera fps follows.
  hz: 30
cameras:
  - id: overshoulder_sim
    role: base
    source: sim_camera
    mjcf_camera: overshoulder
    width: 960
    height: 720
    fps: 30
  - id: threequarter_sim
    role: base
    source: sim_camera
    mjcf_camera: threequarter
    width: 960
    height: 720
    fps: 30
  - id: overhead_sim
    role: base
    source: sim_camera
    mjcf_camera: overhead
    width: 640
    height: 480
    fps: 30
  - id: wrist_right_sim
    role: wrist
    arm_id: right
    source: sim_camera
    mjcf_camera: right_wristcam
    width: 640
    height: 480
    fps: 30
