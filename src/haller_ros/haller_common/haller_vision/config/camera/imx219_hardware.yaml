# IMX219 Camera Configuration (J8IM228-V3.0)
# Hardware configuration for Jetson Orin Nano CSI camera

camera:
  ros__parameters:
    # V4L2 device path (CSI camera on Jetson)
    video_device: "/dev/video0"
    
    # Frame configuration
    frame_id: "camera_optical_frame"
    
    # Image format and resolution
    # Using 640x480 for optimal inference performance on 8GB Orin Nano
    image_width: 640
    image_height: 480
    pixel_format: "YUYV"
    
    # Framerate
    framerate: 30.0
    
    # Camera intrinsics (approximate for 120° FOV IMX219)
    # These should be updated after camera calibration
    camera_info_url: ""
    
    # Auto exposure and white balance
    brightness: 0
    contrast: 32
    saturation: 64
    hue: 0
    gamma: 100
    
    # Image transport
    image_transport: "raw"

