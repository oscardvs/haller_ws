# IMX219 Camera Configuration for Jetson Orin Nano
# Uses GStreamer pipeline for Bayer-to-RGB conversion

gscam_node:
  ros__parameters:
    # GStreamer pipeline for IMX219 CSI camera
    # Captures raw Bayer from v4l2, converts to RGB using software debayer
    # Using 1280x720 @ 30fps for good balance of quality and performance
    gscam_config: >-
      v4l2src device=/dev/video0 !
      video/x-bayer,format=rggb,width=1280,height=720,framerate=30/1 !
      bayer2rgb !
      videoconvert !
      video/x-raw,format=RGB !
      appsink

    # Camera frame (must match URDF)
    frame_id: "camera_optical_frame"

    # Camera info URL (for calibration file)
    # Run: ros2 run camera_calibration cameracalibrator --size 8x6 --square 0.025 image:=/camera/image_raw
    camera_info_url: ""

    # Image dimensions (must match gscam_config)
    image_width: 1280
    image_height: 720

    # Sync camera timestamp with system time
    sync_sink: true

    # Preroll to get first frame faster
    preroll: true

